site_name: Ordination Study Guide
site_description: "Study guide for the five PCA licensure and ordination exams: Bible, Theology, Church Government, Church History, and Sacraments"
site_url: https://schrjacob.github.io/bible-outlines/
repo_url: https://github.com/schrjacob/bible-outlines
edit_uri: edit/main/docs/

copyright: Scripture quotations are from the ESV® Bible, © 2001 by Crossway. Used by permission.

theme:
  name: material
  language: en
  icon:
    logo: material/book-cross
  favicon: assets/favicon.svg
  font:
    text: Source Sans 3
    code: Source Code Pro
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - toc.follow
    - search.highlight
    - search.suggest

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/tiers.js

nav:
  - Bible:
      - bible/index.md
      - Whole Bible: bible/whole-bible.md
      - Old Testament:
          - bible/old-testament/index.md
          - Pentateuch: bible/old-testament/pentateuch.md
          - Historical Books: bible/old-testament/history.md
          - Poetry & Wisdom: bible/old-testament/wisdom.md
          - Major Prophets: bible/old-testament/major-prophets.md
          - Minor Prophets: bible/old-testament/minor-prophets.md
          - Timeline & Covenants: bible/old-testament/timeline.md
          - People & Places: bible/old-testament/people-places.md
          - Passages & Events: bible/old-testament/passages-events.md
      - New Testament:
          - bible/new-testament/index.md
          - Life of Christ: bible/new-testament/life-of-christ.md
          - Gospels: bible/new-testament/gospels.md
          - Acts: bible/new-testament/acts.md
          - Life of Paul: bible/new-testament/paul.md
          - Pauline Epistles: bible/new-testament/pauline-epistles.md
          - General Epistles & Revelation: bible/new-testament/general-epistles-revelation.md
          - People & Places: bible/new-testament/people-places.md
          - Key Passages: bible/new-testament/passages.md
          - Key Topics: bible/new-testament/topics.md
  - Theology:
      - theology/index.md
      - Core Doctrines and Proofs: theology/core-doctrines.md
      - The Bible: theology/bible.md
      - God and His World: theology/god-and-world.md
      - Humankind: theology/humankind.md
      - Covenants and Christ: theology/covenants-christ.md
      - Salvation: theology/salvation.md
      - The Christian Life: theology/christian-life.md
      - The Church and the Spirit: theology/church-spirit.md
      - The Last Things: theology/last-things.md
  - Church Government:
      - church-government/index.md
      - Officers and Courts: church-government/officers-courts.md
      - Calling and Meetings: church-government/calling-meetings.md
      - Discipline and Review: church-government/discipline.md
      - Worship: church-government/worship.md
  - Church History:
      - church-history/index.md
      - Denominations, Events, Terms: church-history/denominations-events.md
      - People: church-history/people.md
      - History of the PCA: church-history/pca-history.md
  - Sacraments:
      - sacraments/index.md

# The home page is reached from the site title, not from a tab.
not_in_nav: |
  /index.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - sane_lists
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

validation:
  links:
    anchors: warn
